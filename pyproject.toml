[build-system]
requires = [
  "setuptools==83.0.0",
  "wheel==0.47.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "halpha-monitor"
version = "0.1.0"
description = "Independent local public-market monitoring service for Halpha"
readme = "README.md"
requires-python = "==3.13.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "exchange-calendars==4.13.2",
  "fastapi==0.139.0",
  "numpy==2.5.1",
  "pandas==2.3.3",
  "pypdf==6.15.0",
  "pydantic==2.13.4",
  "starlette==1.3.1",
  "uvicorn==0.51.0",
  "xlrd==2.0.2",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.7.0",
  "pytest==9.1.1",
]

[project.scripts]
halpha-monitor = "halpha_monitor.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
halpha_monitor = ["static/*"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
pythonpath = ["src"]
testpaths = ["tests"]
