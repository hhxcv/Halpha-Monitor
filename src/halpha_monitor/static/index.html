<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Halpha Monitor</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260727-5">
    <script src="/static/app.js?v=20260727-5" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Halpha Monitor</div>
      <div class="service-facts" aria-live="polite">
        <span class="status-text" id="service-status">正在连接</span>
        <span class="divider" aria-hidden="true"></span>
        <span class="fact-label">最后采集</span>
        <time id="last-refresh">未知</time>
      </div>
    </header>

    <div class="app-shell">
      <aside class="monitor-rail" aria-labelledby="monitor-list-title">
        <h1 id="monitor-list-title">监控列表</h1>
        <nav id="monitor-list" aria-label="已注册监控"></nav>
        <section class="rail-summary" aria-labelledby="summary-title">
          <h2 id="summary-title">监控状态</h2>
          <dl>
            <div><dt>当前可用</dt><dd id="healthy-count">0</dd></div>
            <div><dt>历史 / 过期</dt><dd id="stale-count">0</dd></div>
            <div><dt>暂无可用</dt><dd id="failed-count">0</dd></div>
            <div><dt>已关闭</dt><dd id="disabled-count">0</dd></div>
          </dl>
          <p id="summary-cutoff">状态统计截止：未知</p>
        </section>
      </aside>

      <main class="workspace" id="workspace" aria-busy="true">
        <section class="monitor-context" aria-labelledby="monitor-title">
          <div>
            <h2 id="monitor-title">正在加载监控</h2>
            <p id="monitor-description"></p>
          </div>
          <div class="monitor-status-summary">
            <div class="monitor-state" id="monitor-state">状态未知</div>
            <p id="monitor-status-detail">正在核对数据状态。</p>
            <div class="monitor-control">
              <button id="monitor-control-button" type="button">正在读取</button>
              <span id="monitor-control-status" role="status" aria-live="polite"></span>
            </div>
          </div>
        </section>

        <section class="configuration-region" id="configuration-region" aria-labelledby="configuration-title" hidden>
          <div class="section-head">
            <div>
              <h2 id="configuration-title">采集条件</h2>
              <p>修改后保存到本机；监控已开启时立即刷新。</p>
            </div>
            <p id="configuration-status" role="status" aria-live="polite"></p>
          </div>
          <form id="configuration-form" class="configuration-form">
            <div id="configuration-fields" class="configuration-fields"></div>
            <button id="configuration-submit" type="submit">应用并刷新</button>
          </form>
        </section>

        <section class="filters" id="filters" aria-label="查看条件">
          <div id="dynamic-filters" class="dynamic-filters"></div>
          <label class="filter-field">
            <span>时间范围</span>
            <select id="time-window" aria-label="时间范围"></select>
          </label>
        </section>

        <section class="table-region" aria-labelledby="quote-table-title">
          <div class="section-head">
            <h2 id="quote-table-title">最新监控数据</h2>
            <p id="data-cutoff">数据截止：未知</p>
          </div>
          <div class="table-scroll" tabindex="0" aria-label="最新监控数据，可横向滚动">
            <table>
              <thead><tr id="quote-head"></tr></thead>
              <tbody id="quote-body"></tbody>
            </table>
          </div>
          <p class="empty-state" id="quote-empty" hidden>当前筛选没有可用数据。</p>
        </section>

        <div class="lower-grid">
          <section class="history-region" aria-labelledby="history-title">
            <div class="section-head">
              <h2 id="history-title">USDT 核算价历史</h2>
              <p id="history-series">尚未选择序列</p>
            </div>
            <div class="chart-toolbar">
              <p id="chart-help">悬浮查看精确值 · 滚轮缩放 · 放大后左右拖动</p>
              <div class="chart-actions" aria-label="历史图缩放控制">
                <button id="chart-zoom-out" type="button" aria-label="缩小历史图">−</button>
                <button id="chart-zoom-in" type="button" aria-label="放大历史图">＋</button>
                <button id="chart-reset" type="button">还原</button>
              </div>
            </div>
            <div id="history-chart" class="history-chart" role="group" tabindex="0" aria-describedby="chart-help" aria-label="历史曲线"></div>
            <p id="chart-viewport-status" class="chart-viewport-status" aria-live="polite"></p>
            <p id="collection-gap-note" class="collection-gap-note"></p>
            <dl class="chart-summary" id="chart-summary"></dl>
          </section>

        </div>

        <details class="diagnostics-region" id="diagnostics-region" hidden>
          <summary>
            <span id="issues-title">采集诊断</span>
            <span id="issue-count">0 条</span>
          </summary>
          <div class="diagnostics-body">
            <div class="table-scroll issue-scroll" tabindex="0" aria-label="采集诊断记录">
              <table>
                <thead>
                  <tr><th>范围</th><th>失败时间</th><th>原因</th></tr>
                </thead>
                <tbody id="issue-body"></tbody>
              </table>
            </div>
            <p class="empty-state" id="issue-empty">当前没有采集失败。</p>
          </div>
        </details>

        <div class="page-error" id="page-error" role="alert" hidden></div>
      </main>
    </div>
  </body>
</html>
